<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>İlan Ver</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav>
        <a href="index.html" class="logo">WatchAuction</a>
        <div id="nav-links"></div>
    </nav>

    <div class="form-box">
        <h2 style="text-align:center">Yeni Saat Satış İlanı</h2>
        
        <label>Saat Marka ve Modeli</label>
        <input type="text" id="wName" placeholder="Örn: Rolex Submariner">

        <label>Başlangıç Fiyatı ($)</label>
        <input type="number" id="wPrice" placeholder="5000">
        
        <label>Ürün Görseli</label>
        <input type="file" id="wImage" accept="image/*" style="border:none; padding-left:0;">

        <button onclick="addWatch()" style="width:100%; margin-top:20px;">İlanı Yayınla</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
